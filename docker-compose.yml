services:
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3

  article-api-1:
    build: .
    environment:
      - INSTANCE_ID=1
    ports:
      - "8081:80"
  
  article-api-2:
    build: .
    environment:
      - INSTANCE_ID=2
    ports:
      - "8082:80"
      
  article-api-3:
    build: .
    environment:
      - INSTANCE_ID=3
    ports:
      - "8083:80"

  # 8 PostgreSQL databases
  db-africa:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_africa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
      
  db-antarctica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_antarctica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
      
  db-asia:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_asia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
      
  db-europe:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_europe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
      
  db-northamerica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_northamerica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
      
  db-oceania:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_oceania
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
      
  db-southamerica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_southamerica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
      
  db-global:
