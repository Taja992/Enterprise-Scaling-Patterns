  # ── Profanity database ───────────────────────────────────────────────────────────
  db-profanity:
    image: postgres:16
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
