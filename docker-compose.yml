services:
  # ── nginx — round robin load balancing ──────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3

  # ── Seq — central log and trace repository ──────────────────────────────────
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      # Storage cap triggers automatic deletion of oldest events — no code needed
      SEQ_DATA_STORAGE_SIZE: 2GB
    ports:
      - "5380:80" # Seq web UI: http://localhost:5380
      - "5341:5341" # Serilog sink ingestion
      - "4317:4317" # OTLP gRPC trace ingestion
    volumes:
      - seq-data:/data

    # ── Redis — shared cache for ArticleService and CommentService ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction

     # ── Prometheus — metrics scraper ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3
      - comment-api-1
      - comment-api-2
      - comment-api-3

        # ── Grafana — dashboard UI ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  # ── Article API — 3 load-balanced replicas ────────────────────────────────────
  article-api-1:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8081:8080"
    depends_on:
      - seq
      - redis

  article-api-2:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8082:8080"
    depends_on:
      - seq
      - redis

  article-api-3:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8083:8080"
    depends_on:
      - seq
      - redis

  # ── Draft API — 3 load-balanced replicas ────────────────────────────────────
  draft-api-1:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8084:8080"
    depends_on:
      - db-draft
      - seq

  draft-api-2:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8085:8080"
    depends_on:
      - db-draft
      - seq

  draft-api-3:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8086:8080"
    depends_on:
      - db-draft
      - seq

  # ── Profanity API — 3 load-balanced replicas ─────────────────────────────────
  profanity-api-1:
    build:
      context: .
      dockerfile: Dockerfile.ProfanityService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      ConnectionStrings__ProfanityDb: "Host=db-profanity;Port=5432;Database=profanity;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8090:8080"
    depends_on:
      - db-profanity
      - seq

  profanity-api-2:
    build:
      context: .
      dockerfile: Dockerfile.ProfanityService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      ConnectionStrings__ProfanityDb: "Host=db-profanity;Port=5432;Database=profanity;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8091:8080"
    depends_on:
      - db-profanity
      - seq

  profanity-api-3:
    build:
      context: .
      dockerfile: Dockerfile.ProfanityService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      ConnectionStrings__ProfanityDb: "Host=db-profanity;Port=5432;Database=profanity;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8092:8080"
    depends_on:
      - db-profanity
      - seq

  # ── Comment API — 3 load-balanced replicas ────────────────────────────────────
  comment-api-1:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      ProfanityService__BaseUrl: "http://profanity-api-1:8080"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8087:8080"
    depends_on:
      - db-comment
      - profanity-api-1
      - seq
      - redis

  comment-api-2:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      ProfanityService__BaseUrl: "http://profanity-api-1:8080"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8088:8080"
    depends_on:
      - db-comment
      - profanity-api-1
      - seq
      - redis

  comment-api-3:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      ProfanityService__BaseUrl: "http://profanity-api-1:8080"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8089:8080"
    depends_on:
      - db-comment
      - profanity-api-1
      - seq
      - redis

  # ── 8 Region Article databases ───────────────────────────────────────────────────────────
  db-africa:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_africa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  db-antarctica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_antarctica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  db-asia:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_asia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  db-europe:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_europe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  db-northamerica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_northamerica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"

  db-oceania:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_oceania
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
