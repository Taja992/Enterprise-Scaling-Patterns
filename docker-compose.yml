  # ── Draft database ───────────────────────────────────────────────────────────
  db-draft:
    image: postgres:16
    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - db-draft-data:/var/lib/postgresql/data

volumes:
  seq-data:
  db-draft-data:
  grafana-data:
