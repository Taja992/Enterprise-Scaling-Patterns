      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"

  db-comment:
    image: postgres:16
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"

  db-draft:
    image: postgres:16
    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - db-draft-data:/var/lib/postgresql/data


volumes:
  seq-data:
  grafana-data:
  db-draft-data: