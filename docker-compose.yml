version: "3.9"

services:
  
  # ─────────────────────────────────────────────────────────────
  # NGINX Load Balancer
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3
      - comment-api-1
      - comment-api-2
      - comment-api-3
      - draft-api-1
      - draft-api-2
      - draft-api-3
  
  
  # ─────────────────────────────────────────────────────────────
  # Seq Logging + Tracing
  # ─────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      SEQ_DATA_STORAGE_SIZE: 2GB
      SEQ_LISTEN_URLS: "http://0.0.0.0:80;http://0.0.0.0:5341"
    ports:
      - "5380:80"
      - "5341:5341"
      - "4317:4317"
    volumes:
      - seq-data:/data
  
  
  # ─────────────────────────────────────────────────────────────
  # Redis Cache
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction
  
  
  # ─────────────────────────────────────────────────────────────
  # Prometheus Metrics
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3
      - comment-api-1
      - comment-api-2
      - comment-api-3
  
  
  # ─────────────────────────────────────────────────────────────
  # Grafana Dashboards
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
  
  
  # ─────────────────────────────────────────────────────────────
  # ARTICLE SERVICE (3 replicas)
  # ─────────────────────────────────────────────────────────────
  article-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8081:8080"
    depends_on:
      - seq
      - redis

  article-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8082:8080"
    depends_on:
      - seq
      - redis

  article-api-3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8083:8080"
    depends_on:
      - seq
      - redis
  
  
  # ─────────────────────────────────────────────────────────────
  # DRAFT SERVICE
  # ─────────────────────────────────────────────────────────────
  draft-api-1:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8084:8080"
    depends_on:
      - db-draft
      - seq

  draft-api-2:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8085:8080"
    depends_on:
      - db-draft
      - seq

  draft-api-3:
    build:
      context: .
      dockerfile: Dockerfile.DraftService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      ConnectionStrings__DraftDb: "Host=db-draft;Port=5432;Database=drafts;Username=postgres;Password=postgres"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8086:8080"
    depends_on:
      - db-draft
      - seq
  
  
  # ─────────────────────────────────────────────────────────────
  # COMMENT SERVICE
  # ─────────────────────────────────────────────────────────────
  comment-api-1:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "1"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8087:8080"
    depends_on:
      - db-comment
      - redis
      - seq

  comment-api-2:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "2"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8088:8080"
    depends_on:
      - db-comment
      - redis
      - seq

  comment-api-3:
    build:
      context: .
      dockerfile: Dockerfile.CommentService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: "3"
      ConnectionStrings__CommentDb: "Host=db-comment;Port=5432;Database=comments;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq:5341"
      OpenTelemetry__OtlpEndpoint: "http://seq:4317"
    ports:
      - "8089:8080"
    depends_on:
      - db-comment
      - redis
      - seq
  
  
  # ─────────────────────────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────────────────────────
  db-africa:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_africa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  db-antarctica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_antarctica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  db-asia:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_asia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  db-europe:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_europe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  db-northamerica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_northamerica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"

  db-oceania:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_oceania
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"

  db-southamerica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_southamerica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
